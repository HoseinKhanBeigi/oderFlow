<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategy chart</title>
  <link rel="stylesheet" href="/simulator.css?v=chart3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="play">
    <header class="play-top">
      <a class="back-link" href="/">← Order flow</a>
      <div class="brand-mini">
        <span class="logo">◈</span>
        <strong>Strategy chart</strong>
      </div>
      <label class="field">Symbol
        <input id="play-symbol" value="BTCUSDT" spellcheck="false" />
      </label>
      <div class="chip-row" id="play-market">
        <button type="button" data-market="perp" class="active">Futures</button>
        <button type="button" data-market="spot">Spot</button>
      </div>
      <div class="chip-row" id="play-tf"></div>
      <button id="btn-play" class="primary" type="button">Draw next</button>
      <a class="back-link lab-link" href="/lab.html">Advanced backtest</a>
    </header>

    <div class="play-main">
      <section class="lab-chart-wrap">
        <div id="tv-chart" class="tv-chart"></div>
        <div class="play-status">
          <strong id="play-status-line">Loading previous candles…</strong>
          <span id="play-status-sub"></span>
        </div>
      </section>

      <aside class="lab-side play-side">
        <h2>Next candle paths</h2>
        <p class="hint">Uses last footprint (aggressive buy/sell) and liquidity. Draw next paints 4 possible candles in different colors.</p>
        <div id="path-legend" class="path-legend">
          <div class="path-item"><i style="background:#22c55e"></i><span>Continue</span></div>
          <div class="path-item"><i style="background:#d4a84b"></i><span>Absorb</span></div>
          <div class="path-item"><i style="background:#22d3ee"></i><span>Vacuum</span></div>
          <div class="path-item"><i style="background:#c084fc"></i><span>Fade / fake</span></div>
        </div>
      </aside>
    </div>
  </div>
  <script src="/simulator.bundle.js?v=chart3"></script>
</body>
</html>
