<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategy chart</title>
  <link rel="stylesheet" href="/simulator.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="play">
    <header class="play-top">
      <a class="back-link" href="/">← Order flow</a>
      <div class="brand-mini">
        <span class="logo">◈</span>
        <strong>Strategy chart</strong>
      </div>
      <label class="field">Symbol
        <input id="play-symbol" value="BTCUSDT" spellcheck="false" />
      </label>
      <label class="field">Start price
        <input id="play-price" type="number" value="79100" step="50" />
      </label>
      <div class="chip-row" id="play-speed">
        <button type="button" data-speed="slow">Slow</button>
        <button type="button" data-speed="normal" class="active">Normal</button>
        <button type="button" data-speed="fast">Fast</button>
      </div>
      <button id="btn-play" class="primary" type="button">Play</button>
      <a class="back-link lab-link" href="/lab.html">Advanced backtest</a>
    </header>

    <div class="play-main">
      <section class="lab-chart-wrap">
        <div id="tv-chart" class="tv-chart"></div>
        <div class="play-status">
          <strong id="play-status-line">Pick a strategy, set the numbers, press Play.</strong>
          <span id="play-status-sub"></span>
        </div>
      </section>

      <aside class="lab-side play-side">
        <h2>Strategy</h2>
        <div class="chip-row wrap" id="play-presets"></div>
        <h2 class="after">Parameters</h2>
        <p class="hint">These are the same intensity knobs as the strategy. Play runs the scenario and draws the candles as price moves.</p>
        <div id="play-sliders"></div>
      </aside>
    </div>
  </div>
  <script src="/simulator.bundle.js"></script>
</body>
</html>
